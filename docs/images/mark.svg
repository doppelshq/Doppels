<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Doppels">
  <!-- Doppels mark: rotated square (diamond) with inset ring + hollow core -->
  <g transform="translate(16 16) rotate(45)">
    <rect x="-10" y="-10" width="20" height="20" rx="2.5" fill="#FC4C04"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2.5" stroke="#e5e5e5" stroke-width="2.25" fill="none"/>
    <rect x="-4.25" y="-4.25" width="8.5" height="8.5" rx="0.7" stroke="#ffffff" stroke-width="2.25" fill="none"/>
  </g>
</svg>
