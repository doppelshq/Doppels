# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: doppels

builds:
  - id: doppels
    dir: ./apps/cli
    main: ./cmd/doppels
    binary: doppels
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X doppels.so/cli/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^chore:"

release:
  prerelease: auto
  name_template: "{{.Tag}}"

homebrew_casks:
  - name: doppels
    repository:
      owner: doppelshq
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(brew): update doppels to {{ .Tag }}"
    directory: Casks
    homepage: "https://doppels.so"
    description: "Freeze agent sessions into local deterministic recipes"
    license: "Apache-2.0"
    binaries:
      - doppels
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/doppels"]
          end
